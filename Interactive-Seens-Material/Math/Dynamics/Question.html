<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Atwood Machine Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(30, 41, 59, 0.95);
            padding: 20px;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            width: calc(100vw - 2rem);
            max-width: 440px;
            pointer-events: auto;
            z-index: 10;
            max-height: calc(100dvh - 2rem);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.6); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.8); }
        
        #math-display {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: rgba(15, 23, 42, 0.8);
            padding: 14px;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
            position: relative;
        }
        
        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 8px 14px;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }
        .btn:hover { background-color: #2563eb; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: #475569; cursor: not-allowed; transform: none; opacity: 0.6; }

        .slider-container { margin-bottom: 0.75rem; }
        input[type=range] { width: 100%; accent-color: #3b82f6; height: 28px; background: transparent; cursor: pointer; }
        
        /* Highlighters */
        .hl-m1 { color: #f87171; font-weight: bold; }
        .hl-m2 { color: #60a5fa; font-weight: bold; }
        .hl-t { color: #34d399; font-weight: bold; }
        .hl-g { color: #a78bfa; font-weight: bold; }
        .hl-a { color: #facc15; font-weight: bold; }
        
        .strike { 
            text-decoration: line-through; 
            text-decoration-color: #ef4444; 
            text-decoration-thickness: 2px;
        }

        .scene-label {
            position: absolute;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: ui-monospace, monospace;
            pointer-events: none;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255,255,255,0.15);
            display: none;
            white-space: nowrap;
            z-index: 5;
        }

        @media (max-width: 640px) {
            #ui-container {
                top: 0.75rem;
                left: 0.75rem;
                padding: 16px;
                width: calc(100vw - 1.5rem);
                max-width: calc(100vw - 1.5rem);
                max-height: calc(100dvh - 1.5rem);
            }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            #ui-container {
                top: 0.5rem;
                left: 0.5rem;
                max-width: 320px;
                max-height: calc(100dvh - 1rem);
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="select-none">

    <div id="ui-container">
        <!-- Header with Toggle Button -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-700/80 cursor-pointer select-none" id="ui-header">
            <div class="flex items-center space-x-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
                <h1 class="text-base sm:text-lg font-bold text-white tracking-tight">Atwood Machine</h1>
            </div>
            <button id="toggle-btn" class="p-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-700/60 transition" aria-label="Toggle UI Panel" title="Toggle Panel">
                <svg id="toggle-icon" class="w-5 h-5 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>

        <!-- Collapsible Content -->
        <div id="ui-content" class="pt-3 overflow-y-auto custom-scrollbar space-y-3 text-xs sm:text-sm">
            <p class="text-xs text-slate-300">
                Solve for acceleration using Newton's Second Law.
            </p>
            
            <div id="controls-section">
                <div class="slider-container">
                    <div class="flex justify-between text-xs sm:text-sm mb-1">
                        <label class="hl-m1 font-medium">Mass 1 (m₁):</label>
                        <span id="m1-val" class="font-mono text-slate-300 font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-rose-500/30">5.0 kg</span>
                    </div>
                    <input type="range" id="m1-slider" min="1" max="15" step="0.5" value="5" aria-label="Mass 1">
                </div>

                <div class="slider-container">
                    <div class="flex justify-between text-xs sm:text-sm mb-1">
                        <label class="hl-m2 font-medium">Mass 2 (m₂):</label>
                        <span id="m2-val" class="font-mono text-slate-300 font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-blue-500/30">8.0 kg</span>
                    </div>
                    <input type="range" id="m2-slider" min="1" max="15" step="0.5" value="8" aria-label="Mass 2">
                </div>
            </div>

            <div class="flex justify-between items-center space-x-2">
                <button id="btn-prev" class="btn bg-slate-600 hover:bg-slate-500 py-1.5 sm:py-2 text-xs sm:text-sm">Restart</button>
                <button id="btn-next" class="btn py-1.5 sm:py-2 text-xs sm:text-sm">Next Step</button>
            </div>

            <!-- Step Indicator -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-[11px] sm:text-xs font-semibold text-slate-400">
                    <span id="step-0-ind" class="text-blue-400">1. Setup</span>
                    <span id="step-1-ind">2. FBDs</span>
                    <span id="step-2-ind">3. Eqns</span>
                    <span id="step-3-ind">4. Solve</span>
                    <span id="step-4-ind">5. Anim</span>
                </div>
                <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-500" style="width: 20%;"></div>
                </div>
            </div>
            
            <div id="math-display">
                <!-- Dynamic Math Content gets injected here -->
            </div>
            
            <div class="flex items-center justify-between pt-1 text-[11px] text-slate-400">
                <button id="reset-cam-btn" type="button" class="px-2.5 py-1 text-xs bg-slate-700/60 hover:bg-slate-600 text-slate-300 hover:text-white rounded transition flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Reset View</span>
                </button>
                <span id="gesture-hint" class="text-right">
                    Drag to rotate • Pinch zoom
                </span>
            </div>
        </div>

        <!-- Collapsed Summary Bar -->
        <div id="ui-collapsed-summary" class="hidden pt-2 text-xs flex items-center justify-between text-slate-300">
            <span>Step: <b id="summary-step" class="text-blue-400">1 / 5</b> | a: <b id="summary-accel" class="text-yellow-400">0.00</b></span>
            <span class="italic text-slate-400">Tap to expand</span>
        </div>
    </div>

    <!-- 3D Scene HTML Labels -->
    <div id="label-m1" class="scene-label hl-m1">m₁</div>
    <div id="label-m2" class="scene-label hl-m2">m₂</div>
    <div id="label-acc" class="scene-label hl-a text-base bg-slate-900 border-yellow-400">a = 0.00 m/s²</div>

    <div id="canvas-container"></div>

    <script>
        let m1 = 5.0;
        let m2 = 8.0;
        const g = 9.81;
        let a = 0;
        let t_tension = 0;
        
        let currentStep = 0;
        const totalSteps = 5;
        let isCollapsed = false;
        
        let simTime = 0;
        let isAnimating = false;
        const initialY1 = 4;
        const initialY2 = 4;
        const pulleyRadius = 1.5;
        const pulleyY = 10;
        const DEFAULT_CAM_POS = new THREE.Vector3(0, 8, 25);

        let scene, camera, renderer, controls;
        let mass1Mesh, mass2Mesh, pulleyMesh;
        let string1, string2, stringArc;
        
        let fbdGroup1, fbdGroup2;
        let fbd1TargetX = 0, fbd2TargetX = 0;
        let fbdOffset = 0;
        
        let arrowT1, arrowW1, arrowT2, arrowW2;
        let arrowAcc1, arrowAcc2;

        const mathDisplay = document.getElementById('math-display');
        const btnNext = document.getElementById('btn-next');
        const btnPrev = document.getElementById('btn-prev');
        const progressBar = document.getElementById('progress-bar');
        
        const m1Slider = document.getElementById('m1-slider');
        const m2Slider = document.getElementById('m2-slider');
        const m1Val = document.getElementById('m1-val');
        const m2Val = document.getElementById('m2-val');

        const labelM1 = document.getElementById('label-m1');
        const labelM2 = document.getElementById('label-m2');
        const labelAcc = document.getElementById('label-acc');
        const toggleBtn = document.getElementById('toggle-btn');
        const uiHeader = document.getElementById('ui-header');
        const uiContent = document.getElementById('ui-content');
        const toggleIcon = document.getElementById('toggle-icon');
        const uiCollapsedSummary = document.getElementById('ui-collapsed-summary');
        const summaryStep = document.getElementById('summary-step');
        const summaryAccel = document.getElementById('summary-accel');
        const resetCamBtn = document.getElementById('reset-cam-btn');
        const gestureHint = document.getElementById('gesture-hint');

        function togglePanel(e) {
            if (e && e.target && (e.target.closest('#reset-cam-btn') || e.target.closest('input') || e.target.closest('button.btn'))) return;
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                uiContent.classList.add('hidden');
                uiCollapsedSummary.classList.remove('hidden');
                toggleIcon.style.transform = 'rotate(-90deg)';
            } else {
                uiContent.classList.remove('hidden');
                uiCollapsedSummary.classList.add('hidden');
                toggleIcon.style.transform = 'rotate(0deg)';
            }
        }

        uiHeader.addEventListener('click', togglePanel);
        toggleBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePanel(); });

        resetCamBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetCamera();
        });

        function resetCamera() {
            adaptCameraForScreen();
            controls.target.set(0, 6, 0);
            controls.update();
        }

        function adaptCameraForScreen() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isNarrow = width < 640 || width < height;

            if (isNarrow) {
                camera.position.set(0, 8, 30);
                camera.fov = 52;
            } else {
                camera.position.copy(DEFAULT_CAM_POS);
                camera.fov = 45;
            }
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            gestureHint.textContent = '1 finger rotate • Pinch zoom';
        } else {
            gestureHint.textContent = 'Left drag rotate • Scroll zoom';
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); 

            const width = window.innerWidth;
            const height = window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            adaptCameraForScreen();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 6, 0);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(30, 30, 0x334155, 0x1e293b);
            scene.add(gridHelper);
            
            buildMachine();
            buildFBDs();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 150));
            btnNext.addEventListener('click', nextStep);
            btnPrev.addEventListener('click', restartStep);
            
            m1Slider.addEventListener('input', (e) => { m1 = parseFloat(e.target.value); updatePhysics(); });
            m2Slider.addEventListener('input', (e) => { m2 = parseFloat(e.target.value); updatePhysics(); });

            updatePhysics();
            setStep(0);

            if (window.innerHeight < 450 && window.innerWidth > window.innerHeight) {
                togglePanel();
            }
        }

        function buildMachine() {
            const pulleyGeo = new THREE.CylinderGeometry(pulleyRadius, pulleyRadius, 0.5, 32);
            pulleyGeo.rotateX(Math.PI / 2);
            const pulleyMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.6, roughness: 0.4 });
            pulleyMesh = new THREE.Mesh(pulleyGeo, pulleyMat);
            pulleyMesh.position.set(0, pulleyY, 0);
            pulleyMesh.castShadow = true;
            scene.add(pulleyMesh);
            
            const standGeo = new THREE.BoxGeometry(0.5, pulleyY, 0.5);
            const standMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
            const stand = new THREE.Mesh(standGeo, standMat);
            stand.position.set(0, pulleyY / 2, -1);
            scene.add(stand);

            const massGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            
            const mat1 = new THREE.MeshStandardMaterial({ color: 0xf87171 });
            mass1Mesh = new THREE.Mesh(massGeo, mat1);
            mass1Mesh.position.set(-pulleyRadius, initialY1, 0);
            mass1Mesh.castShadow = true;
            scene.add(mass1Mesh);

            const mat2 = new THREE.MeshStandardMaterial({ color: 0x60a5fa });
            mass2Mesh = new THREE.Mesh(massGeo, mat2);
            mass2Mesh.position.set(pulleyRadius, initialY2, 0);
            mass2Mesh.castShadow = true;
            scene.add(mass2Mesh);

            const stringMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0 });
            
            const strGeo1 = new THREE.CylinderGeometry(0.05, 0.05, 1);
            string1 = new THREE.Mesh(strGeo1, stringMat);
            scene.add(string1);

            const strGeo2 = new THREE.CylinderGeometry(0.05, 0.05, 1);
            string2 = new THREE.Mesh(strGeo2, stringMat);
            scene.add(string2);
            
            const arcGeo = new THREE.TorusGeometry(pulleyRadius, 0.05, 8, 32, Math.PI);
            const arcMesh = new THREE.Mesh(arcGeo, stringMat);
            arcMesh.position.set(0, pulleyY, 0);
            scene.add(arcMesh);
            
            updateStrings();
        }

        function buildFBDs() {
            fbdGroup1 = new THREE.Group();
            fbdGroup2 = new THREE.Group();
            scene.add(fbdGroup1);
            scene.add(fbdGroup2);

            const dirUp = new THREE.Vector3(0, 1, 0);
            const dirDown = new THREE.Vector3(0, -1, 0);
            
            arrowT1 = new THREE.ArrowHelper(dirUp, new THREE.Vector3(0,0,0), 2, 0x34d399, 0.5, 0.3);
            arrowW1 = new THREE.ArrowHelper(dirDown, new THREE.Vector3(0,0,0), 2, 0xa78bfa, 0.5, 0.3);
            fbdGroup1.add(arrowT1);
            fbdGroup1.add(arrowW1);

            arrowT2 = new THREE.ArrowHelper(dirUp, new THREE.Vector3(0,0,0), 2, 0x34d399, 0.5, 0.3);
            arrowW2 = new THREE.ArrowHelper(dirDown, new THREE.Vector3(0,0,0), 2, 0xa78bfa, 0.5, 0.3);
            fbdGroup2.add(arrowT2);
            fbdGroup2.add(arrowW2);
            
            arrowAcc1 = new THREE.ArrowHelper(dirUp, new THREE.Vector3(-1.5, 0, 0), 2, 0xfacc15, 0.5, 0.3);
            arrowAcc2 = new THREE.ArrowHelper(dirDown, new THREE.Vector3(1.5, 0, 0), 2, 0xfacc15, 0.5, 0.3);
            arrowAcc1.visible = false;
            arrowAcc2.visible = false;
            fbdGroup1.add(arrowAcc1);
            fbdGroup2.add(arrowAcc2);
            
            fbdGroup1.visible = false;
            fbdGroup2.visible = false;
        }

        function updatePhysics() {
            m1Val.textContent = m1.toFixed(1) + " kg";
            m2Val.textContent = m2.toFixed(1) + " kg";
            
            const scale1 = Math.pow(m1 / 5, 1/3);
            const scale2 = Math.pow(m2 / 5, 1/3);
            mass1Mesh.scale.set(scale1, scale1, scale1);
            mass2Mesh.scale.set(scale2, scale2, scale2);
            
            a = g * (m2 - m1) / (m1 + m2);
            t_tension = m1 * (g + a);
            summaryAccel.textContent = Math.abs(a).toFixed(2);
            
            const visScale = 0.05;
            const l_w1 = m1 * g * visScale;
            const l_w2 = m2 * g * visScale;
            const l_t = t_tension * visScale;
            
            arrowW1.setLength(l_w1, 0.5, 0.3);
            arrowW2.setLength(l_w2, 0.5, 0.3);
            arrowT1.setLength(l_t, 0.5, 0.3);
            arrowT2.setLength(l_t, 0.5, 0.3);
            
            const accLen = Math.abs(a) * 0.3;
            if(accLen > 0.1) {
                arrowAcc1.setLength(accLen, 0.4, 0.2);
                arrowAcc1.setDirection(a > 0 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(0,-1,0));
                arrowAcc2.setLength(accLen, 0.4, 0.2);
                arrowAcc2.setDirection(a > 0 ? new THREE.Vector3(0,-1,0) : new THREE.Vector3(0,1,0));
            }
            
            updateMathDisplay();
        }

        function updateStrings() {
            const len1 = pulleyY - mass1Mesh.position.y;
            string1.scale.set(1, len1, 1);
            string1.position.set(-pulleyRadius, pulleyY - len1/2, 0);
            
            const len2 = pulleyY - mass2Mesh.position.y;
            string2.scale.set(1, len2, 1);
            string2.position.set(pulleyRadius, pulleyY - len2/2, 0);
        }

        function nextStep() {
            if(currentStep < totalSteps - 1) setStep(currentStep + 1);
        }
        function restartStep() {
            setStep(0);
        }

        function setStep(step) {
            currentStep = step;
            summaryStep.textContent = `${step + 1} / ${totalSteps}`;
            
            isAnimating = false;
            m1Slider.disabled = (step > 0);
            m2Slider.disabled = (step > 0);
            
            if (step === 0) {
                mass1Mesh.position.y = initialY1;
                mass2Mesh.position.y = initialY2;
                pulleyMesh.rotation.z = 0;
                simTime = 0;
                updateStrings();
                
                fbdOffset = 0;
                fbdGroup1.visible = false;
                fbdGroup2.visible = false;
                arrowAcc1.visible = false;
                arrowAcc2.visible = false;
                labelAcc.style.display = 'none';
            }
            else if (step === 1) {
                fbdGroup1.visible = true;
                fbdGroup2.visible = true;
                fbd1TargetX = -4;
                fbd2TargetX = 4;
                arrowAcc1.visible = false;
                arrowAcc2.visible = false;
                labelAcc.style.display = 'none';
            }
            else if (step === 2) {
                fbd1TargetX = -4;
                fbd2TargetX = 4;
                arrowAcc1.visible = false;
                arrowAcc2.visible = false;
                labelAcc.style.display = 'none';
            }
            else if (step === 3) {
                fbd1TargetX = -4;
                fbd2TargetX = 4;
                if(Math.abs(a) > 0.1) {
                    arrowAcc1.visible = true;
                    arrowAcc2.visible = true;
                }
                labelAcc.style.display = 'block';
                labelAcc.innerHTML = `a = ${Math.abs(a).toFixed(2)} m/s²`;
            }
            else if (step === 4) {
                isAnimating = true;
                fbdGroup1.visible = false;
                fbdGroup2.visible = false;
            }
            
            updateUI();
        }

        function updateUI() {
            btnPrev.disabled = currentStep === 0;
            if (currentStep === totalSteps - 1) {
                btnNext.disabled = true;
                btnNext.textContent = "Animating...";
            } else {
                btnNext.disabled = false;
                btnNext.textContent = "Next Step";
            }
            
            progressBar.style.width = `${(currentStep + 1) * 20}%`;
            for (let i = 0; i < totalSteps; i++) {
                const el = document.getElementById(`step-${i}-ind`);
                if (i === currentStep) el.className = "text-blue-400 font-bold";
                else if (i < currentStep) el.className = "text-green-400";
                else el.className = "text-slate-500";
            }
            
            updateMathDisplay();
        }

        function updateMathDisplay() {
            let html = "";
            switch(currentStep) {
                case 0:
                    html = `
                        <div class="mb-1"><strong>Step 1: Setup</strong></div>
                        <p class="text-slate-300">Adjust the masses above. The system is currently held at rest.</p>
                        <p class="text-slate-300 mt-2">Notice how <span class="hl-m1">m₁</span> and <span class="hl-m2">m₂</span> are connected by an inextensible string over a frictionless pulley.</p>
                    `;
                    break;
                case 1:
                    html = `
                        <div class="mb-1"><strong>Step 2: Free Body Diagrams</strong></div>
                        <p class="text-slate-300 mb-2">Two vertical forces act on each mass:</p>
                        <ul class="list-disc pl-4 space-y-1 text-slate-300 text-xs sm:text-sm">
                            <li><span class="hl-t">Tension (T)</span>: Pulls upwards equally on both masses.</li>
                            <li><span class="hl-g">Gravity (mg)</span>: Pulls downwards proportional to mass.</li>
                        </ul>
                    `;
                    break;
                case 2:
                    html = `
                        <div class="mb-1"><strong>Step 3: Setup Equations (F = ma)</strong></div>
                        <div class="bg-slate-900/60 p-2.5 rounded space-y-2 font-mono text-xs sm:text-sm border border-slate-700">
                            <div>
                                <span class="text-slate-400">For m₂ (Downwards):</span><br>
                                <span class="hl-m2">m₂</span><span class="hl-g">g</span> - <span class="hl-t">T</span> = <span class="hl-m2">m₂</span><span class="hl-a">a</span>
                            </div>
                            <div class="border-t border-slate-700 pt-1.5">
                                <span class="text-slate-400">For m₁ (Upwards):</span><br>
                                <span class="hl-t">T</span> - <span class="hl-m1">m₁</span><span class="hl-g">g</span> = <span class="hl-m1">m₁</span><span class="hl-a">a</span>
                            </div>
                        </div>
                    `;
                    break;
                case 3:
                    html = `
                        <div class="mb-1"><strong>Step 4: Solve for Acceleration</strong></div>
                        <p class="text-xs text-slate-300 mb-1">Add equations. Notice <span class="hl-t">T</span> cancels out!</p>
                        <div class="bg-slate-900/60 p-2.5 rounded space-y-1 font-mono text-xs border border-slate-700">
                            <div>(m₂ - m₁)g = (m₁ + m₂)a</div>
                            <div class="hl-a pt-1">a = g &middot; (m₂ - m₁) / (m₁ + m₂)</div>
                        </div>
                        <div class="mt-2 text-center bg-blue-950/40 border border-blue-500/40 rounded p-1.5 font-bold">
                            <span class="hl-a">a = ${Math.abs(a).toFixed(2)} m/s²</span> ${a > 0 ? '(m₂ accelerates down)' : (a < 0 ? '(m₁ accelerates down)' : '(Balanced)')}
                        </div>
                    `;
                    break;
                case 4:
                    html = `
                        <div class="mb-1"><strong>Step 5: Animation</strong></div>
                        <p class="text-slate-300">The system accelerates at <span class="hl-a font-mono font-bold">${Math.abs(a).toFixed(2)} m/s²</span>.</p>
                        <p class="text-slate-300 mt-2 text-xs font-mono">
                            Kinematics: y(t) = y₀ + &frac12;at²
                        </p>
                    `;
                    break;
            }
            mathDisplay.innerHTML = html;
        }

        function updateLabels() {
            const updatePos = (label, obj, offsetY = 0) => {
                if(label.style.display === 'none') return;
                const tempV = new THREE.Vector3();
                obj.getWorldPosition(tempV);
                tempV.project(camera);
                const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
                label.style.left = `${x}px`;
                label.style.top = `${y + offsetY}px`;
                label.style.display = 'block';
            };

            updatePos(labelM1, mass1Mesh, 0);
            updatePos(labelM2, mass2Mesh, 0);
            
            if (currentStep >= 3) {
                if (a > 0) updatePos(labelAcc, mass2Mesh, -45);
                else if (a < 0) updatePos(labelAcc, mass1Mesh, -45);
                else labelAcc.style.display = 'none';
            }
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            if (width < 640 || width < height) {
                camera.fov = 52;
            } else {
                camera.fov = 45;
            }
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const dt = clock.getDelta();

            if (currentStep >= 1 && currentStep < 4) {
                fbdOffset += (1 - fbdOffset) * 0.1;
                fbdGroup1.position.copy(mass1Mesh.position);
                fbdGroup1.position.x += fbd1TargetX * fbdOffset;
                fbdGroup2.position.copy(mass2Mesh.position);
                fbdGroup2.position.x += fbd2TargetX * fbdOffset;
            }

            if (isAnimating) {
                simTime += dt;
                const dy = 0.5 * a * simTime * simTime;
                
                mass1Mesh.position.y = initialY1 + dy;
                mass2Mesh.position.y = initialY2 - dy;
                
                if (mass2Mesh.position.y <= 1.0 || mass1Mesh.position.y <= 1.0) {
                    isAnimating = false;
                }
                
                pulleyMesh.rotation.z += (a / pulleyRadius) * dt;
                updateStrings();
            }

            updateLabels();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>

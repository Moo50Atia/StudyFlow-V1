<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Torque and Moment Vector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            z-index: 1;
        }
        #ui-container {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(30, 41, 59, 0.92);
            padding: 20px;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            width: calc(100vw - 2rem);
            max-width: 360px;
            pointer-events: auto;
            z-index: 10;
            max-height: calc(100dvh - 2rem);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.6); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.8); }

        .slider-container {
            margin-bottom: 0.75rem;
        }
        input[type=range] {
            width: 100%;
            accent-color: #3b82f6;
            height: 28px;
            background: transparent;
            cursor: pointer;
        }
        #math-display {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: rgba(15, 23, 42, 0.8);
            padding: 12px;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .highlight-force { color: #ef4444; font-weight: bold; }
        .highlight-moment { color: #38bdf8; font-weight: bold; }
        .highlight-radius { color: #facc15; font-weight: bold; }

        @media (max-width: 640px) {
            #ui-container {
                top: 0.75rem;
                left: 0.75rem;
                padding: 16px;
                width: calc(100vw - 1.5rem);
                max-width: calc(100vw - 1.5rem);
                max-height: calc(100dvh - 1.5rem);
            }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            #ui-container {
                top: 0.5rem;
                left: 0.5rem;
                max-width: 320px;
                max-height: calc(100dvh - 1rem);
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="select-none">

    <div id="ui-container">
        <!-- Header with Toggle Button -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-700/80 cursor-pointer select-none" id="ui-header">
            <div class="flex items-center space-x-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
                <h1 class="text-base sm:text-lg font-bold text-white tracking-tight">Torque & Moment</h1>
            </div>
            <button id="toggle-btn" class="p-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-700/60 transition" aria-label="Toggle UI Panel" title="Toggle Panel">
                <svg id="toggle-icon" class="w-5 h-5 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>

        <!-- Collapsible Content -->
        <div id="ui-content" class="pt-3 overflow-y-auto custom-scrollbar space-y-3 text-xs sm:text-sm">
            <p class="text-xs text-slate-300">
                Visualize cross product: <span class="highlight-moment">Moment</span> = <span class="highlight-radius">Radius</span> &times; <span class="highlight-force">Force</span>
            </p>
            
            <!-- Controls -->
            <div class="slider-container">
                <div class="flex justify-between text-xs sm:text-sm mb-1">
                    <label for="force-mag" class="text-slate-200 font-medium">Force Magnitude (|F|):</label>
                    <span id="force-mag-val" class="font-mono text-blue-400 font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-blue-500/30">5.0 N</span>
                </div>
                <input type="range" id="force-mag" min="0" max="10" step="0.1" value="5" aria-label="Force Magnitude">
            </div>

            <div class="slider-container">
                <div class="flex justify-between text-xs sm:text-sm mb-1">
                    <label for="force-angle" class="text-slate-200 font-medium">Force Angle (&theta;):</label>
                    <span id="force-angle-val" class="font-mono text-blue-400 font-bold bg-slate-800/80 px-2 py-0.5 rounded border border-blue-500/30">90&deg;</span>
                </div>
                <input type="range" id="force-angle" min="0" max="360" step="1" value="90" aria-label="Force Angle">
                <div class="grid grid-cols-4 gap-1 pt-1">
                    <button type="button" class="preset-angle px-1 py-0.5 text-[11px] bg-slate-700/70 hover:bg-slate-600 rounded text-slate-300 hover:text-white text-center" data-val="0">0&deg;</button>
                    <button type="button" class="preset-angle px-1 py-0.5 text-[11px] bg-slate-700/70 hover:bg-slate-600 rounded text-slate-300 hover:text-white text-center" data-val="90">90&deg; (Max)</button>
                    <button type="button" class="preset-angle px-1 py-0.5 text-[11px] bg-slate-700/70 hover:bg-slate-600 rounded text-slate-300 hover:text-white text-center" data-val="180">180&deg;</button>
                    <button type="button" class="preset-angle px-1 py-0.5 text-[11px] bg-slate-700/70 hover:bg-slate-600 rounded text-slate-300 hover:text-white text-center" data-val="270">270&deg; (-Max)</button>
                </div>
            </div>
            
            <!-- Real-time Math Display -->
            <div id="math-display" class="space-y-1.5">
                <div class="text-slate-300 text-xs">
                    |\vec{M}| = |\vec{r}| &middot; |\vec{F}| &middot; sin(&theta;)
                </div>
                <div class="text-xs">
                    |<span class="highlight-moment">M</span>| = <span class="highlight-radius">5.0 m</span> &middot; <span class="highlight-force" id="calc-f">5.0 N</span> &middot; sin(<span id="calc-theta">90&deg;</span>)
                </div>
                <div class="text-sm sm:text-base mt-2 bg-slate-900/60 p-2 rounded text-center border border-slate-700 font-bold">
                    Torque = <span class="highlight-moment" id="calc-torque">25.00</span> N&middot;m
                </div>
            </div>

            <div class="flex items-center justify-between pt-1 text-[11px] text-slate-400">
                <button id="reset-cam-btn" type="button" class="px-2.5 py-1 text-xs bg-slate-700/60 hover:bg-slate-600 text-slate-300 hover:text-white rounded transition flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Reset View</span>
                </button>
                <span id="gesture-hint" class="text-right">
                    Drag to rotate • Pinch zoom
                </span>
            </div>
        </div>

        <!-- Collapsed Summary Bar -->
        <div id="ui-collapsed-summary" class="hidden pt-2 text-xs flex items-center justify-between text-slate-300">
            <span>F: <b id="summary-f" class="text-rose-400">5.0 N</b> | &theta;: <b id="summary-theta" class="text-yellow-400">90&deg;</b></span>
            <span>M: <b id="summary-m" class="text-sky-400">25.0 N&middot;m</b></span>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let forceArrow, momentArrow, radiusLine;
        
        const R_LENGTH = 5.0;
        const MOMENT_SCALE = 0.2;
        const DEFAULT_CAM_POS = new THREE.Vector3(6, 6, 12);
        let isCollapsed = false;
        
        const magSlider = document.getElementById('force-mag');
        const angleSlider = document.getElementById('force-angle');
        const magVal = document.getElementById('force-mag-val');
        const angleVal = document.getElementById('force-angle-val');
        
        const calcF = document.getElementById('calc-f');
        const calcTheta = document.getElementById('calc-theta');
        const calcTorque = document.getElementById('calc-torque');
        const toggleBtn = document.getElementById('toggle-btn');
        const uiHeader = document.getElementById('ui-header');
        const uiContent = document.getElementById('ui-content');
        const toggleIcon = document.getElementById('toggle-icon');
        const uiCollapsedSummary = document.getElementById('ui-collapsed-summary');
        const summaryF = document.getElementById('summary-f');
        const summaryTheta = document.getElementById('summary-theta');
        const summaryM = document.getElementById('summary-m');
        const resetCamBtn = document.getElementById('reset-cam-btn');
        const gestureHint = document.getElementById('gesture-hint');

        function togglePanel(e) {
            if (e && e.target && (e.target.closest('#reset-cam-btn') || e.target.closest('input') || e.target.closest('button.preset-angle'))) return;
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                uiContent.classList.add('hidden');
                uiCollapsedSummary.classList.remove('hidden');
                toggleIcon.style.transform = 'rotate(-90deg)';
            } else {
                uiContent.classList.remove('hidden');
                uiCollapsedSummary.classList.add('hidden');
                toggleIcon.style.transform = 'rotate(0deg)';
            }
        }

        uiHeader.addEventListener('click', togglePanel);
        toggleBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePanel(); });

        document.querySelectorAll('.preset-angle').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                angleSlider.value = btn.dataset.val;
                updatePhysics();
            });
        });

        resetCamBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetCamera();
        });

        function resetCamera() {
            adaptCameraForScreen();
            controls.target.set(2.5, 0, 0);
            controls.update();
        }

        function adaptCameraForScreen() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isNarrow = width < 640 || width < height;

            if (isNarrow) {
                camera.position.set(7, 7, 15);
                camera.fov = 52;
            } else {
                camera.position.copy(DEFAULT_CAM_POS);
                camera.fov = 45;
            }
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            gestureHint.textContent = '1 finger rotate • Pinch zoom';
        } else {
            gestureHint.textContent = 'Left drag rotate • Scroll zoom';
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); 

            const width = window.innerWidth;
            const height = window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            adaptCameraForScreen();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(2.5, 0, 0);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);
            
            const pointLight = new THREE.PointLight(0x93c5fd, 0.6, 20);
            pointLight.position.set(-2, 2, 5);
            scene.add(pointLight);

            const gridHelper = new THREE.GridHelper(20, 20, 0x334155, 0x1e293b);
            gridHelper.rotation.x = Math.PI / 2;
            gridHelper.position.z = -0.5;
            scene.add(gridHelper);

            createModels();
            setupVectors();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 150));
            magSlider.addEventListener('input', updatePhysics);
            angleSlider.addEventListener('input', updatePhysics);

            updatePhysics();

            if (window.innerHeight < 450 && window.innerWidth > window.innerHeight) {
                togglePanel();
            }
        }

        function createModels() {
            const materialBolt = new THREE.MeshStandardMaterial({ 
                color: 0x475569, metalness: 0.8, roughness: 0.4 
            });
            const materialWrench = new THREE.MeshStandardMaterial({ 
                color: 0x94a3b8, metalness: 0.9, roughness: 0.2 
            });

            const boltGroup = new THREE.Group();
            const headGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.6, 6);
            headGeo.rotateX(Math.PI / 2);
            const headMesh = new THREE.Mesh(headGeo, materialBolt);
            headMesh.castShadow = true;
            headMesh.receiveShadow = true;
            boltGroup.add(headMesh);
            
            const threadGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
            threadGeo.rotateX(Math.PI / 2);
            const threadMesh = new THREE.Mesh(threadGeo, materialBolt);
            threadMesh.position.z = -1;
            threadMesh.castShadow = true;
            threadMesh.receiveShadow = true;
            boltGroup.add(threadMesh);
            scene.add(boltGroup);

            const wrenchGroup = new THREE.Group();
            const ringGeo = new THREE.TorusGeometry(0.8, 0.25, 16, 32);
            const ringMesh = new THREE.Mesh(ringGeo, materialWrench);
            ringMesh.castShadow = true;
            ringMesh.receiveShadow = true;
            wrenchGroup.add(ringMesh);

            const handleLength = 4.8;
            const handleGeo = new THREE.BoxGeometry(handleLength, 0.4, 0.2);
            const handleMesh = new THREE.Mesh(handleGeo, materialWrench);
            handleMesh.position.set(0.8 + handleLength / 2, 0, 0);
            handleMesh.castShadow = true;
            handleMesh.receiveShadow = true;
            wrenchGroup.add(handleMesh);
            
            wrenchGroup.position.z = 0; 
            scene.add(wrenchGroup);
        }

        function setupVectors() {
            const originF = new THREE.Vector3(R_LENGTH, 0, 0);
            forceArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), originF, 5, 0xef4444, 1, 0.4);
            scene.add(forceArrow);

            momentArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 5, 0x38bdf8, 1, 0.5);
            scene.add(momentArrow);

            const rPoints = [new THREE.Vector3(0,0,0), new THREE.Vector3(R_LENGTH,0,0)];
            const rGeo = new THREE.BufferGeometry().setFromPoints(rPoints);
            const rMat = new THREE.LineDashedMaterial({
                color: 0xfacc15,
                linewidth: 2,
                scale: 1,
                dashSize: 0.2,
                gapSize: 0.1,
            });
            radiusLine = new THREE.Line(rGeo, rMat);
            radiusLine.computeLineDistances();
            scene.add(radiusLine);
            
            const dotGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            const dotMesh = new THREE.Mesh(dotGeo, dotMat);
            dotMesh.position.copy(originF);
            scene.add(dotMesh);
        }

        function updatePhysics() {
            const fMag = parseFloat(magSlider.value);
            const fAngleDeg = parseFloat(angleSlider.value);
            const fAngleRad = THREE.MathUtils.degToRad(fAngleDeg);

            magVal.textContent = fMag.toFixed(1) + ' N';
            angleVal.innerHTML = fAngleDeg + '&deg;';
            calcF.textContent = fMag.toFixed(1) + ' N';
            calcTheta.innerHTML = fAngleDeg + '&deg;';

            const fx = Math.cos(fAngleRad);
            const fy = Math.sin(fAngleRad);
            const forceDir = new THREE.Vector3(fx, fy, 0);
            
            if (fMag > 0.1) {
                forceArrow.visible = true;
                forceArrow.setDirection(forceDir.normalize());
                forceArrow.setLength(fMag * 0.8, Math.max(0.4, fMag * 0.15), Math.max(0.2, fMag * 0.08)); 
            } else {
                forceArrow.visible = false;
            }

            const torqueZ = R_LENGTH * fMag * fy;
            const torqueMag = Math.abs(torqueZ);
            
            calcTorque.textContent = torqueZ.toFixed(2);
            calcTorque.style.color = torqueZ < 0 ? "#ec4899" : "#38bdf8";

            summaryF.textContent = fMag.toFixed(1) + ' N';
            summaryTheta.innerHTML = fAngleDeg + '&deg;';
            summaryM.textContent = torqueZ.toFixed(2) + ' N·m';

            if (torqueMag > 0.1) {
                momentArrow.visible = true;
                const momentDir = new THREE.Vector3(0, 0, Math.sign(torqueZ));
                momentArrow.setDirection(momentDir);
                const visualLength = torqueMag * MOMENT_SCALE;
                momentArrow.setLength(visualLength, Math.min(1.0, visualLength * 0.3), Math.min(0.5, visualLength * 0.15));
            } else {
                momentArrow.visible = false;
            }
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            if (width < 640 || width < height) {
                camera.fov = 52;
            } else {
                camera.fov = 45;
            }
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>

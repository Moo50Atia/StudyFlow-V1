[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "v3_engine"
version = "0.1.0"
description = "V3 Core Business Feature Processing Engine"
authors = [{ name = "StudyFlow V3 Team" }]
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.34.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0,<0.29",
    "pydantic>=2.10.0",
    "numpy==2.5.2",
    "playwright==1.63.0",
    "pdfplumber==0.11.10",
    "pytesseract==0.3.13",
    "pillow>=10.0.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "notebooklm-py==0.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
import_mode = "importlib"
markers = [
    "live: marks tests as requiring real live credentials (run with '-m live')",
    "container: marks tests as requiring real Docker container runtime",
    "temporal: marks tests as requiring a running or downloaded Temporal test server",
    "browser_ui: marks tests as requiring a real browser/Playwright runtime",
    "integration: marks tests as requiring connected multi-service integration",
    "deployment: marks tests as requiring deployment packaging or target database",
]
